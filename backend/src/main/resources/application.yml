spring:
  datasource:
    # H2 (로컬 테스트용)
    url: jdbc:h2:mem:catwashhub;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

    # MySQL (운영 환경)
#    url: jdbc:mysql://localhost:3306/catwashhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    username: ${DB_USERNAME:root}
#    password: ${DB_PASSWORD:}
#    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console 접속 가능
      path: /h2-console

  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql

  jpa:
    hibernate:
      ddl-auto: create-drop  # 앱 시작 시 테이블 자동 생성, 종료 시 삭제
    show-sql: true
    defer-datasource-initialization: true  # JPA 테이블 생성 후 data.sql 실행
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

    # MySQL Dialect (운영 환경)
#    properties:
#      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect

